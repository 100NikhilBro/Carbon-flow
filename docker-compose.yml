services:
  postgres:
    image: postgres:17
    container_name: carbonflow_postgres

    environment:
      POSTGRES_DB: carbonflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: carbonflow_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: